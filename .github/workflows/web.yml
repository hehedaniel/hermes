# Publica la versión web (instalable en iPhone) en GitHub Pages en cada push a main,
# solo si pasan las comprobaciones (ci.yml).
# Primera vez: Settings → Pages → Source: "GitHub Actions".
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  comprobaciones:
    uses: ./.github/workflows/ci.yml

  build:
    needs: comprobaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hacen falta las etiquetas para saber la versión
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versión = última etiqueta vX.Y.Z (como el APK)
        run: |
          v=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json','utf8'));a.expo.version='$v';fs.writeFileSync('app.json',JSON.stringify(a,null,2)+'\n');console.log('versión',a.expo.version)"
      - name: Exportar la web
        run: npm run build:web
        env:
          # La web vive en https://<usuario>.github.io/<repo>
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
